<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .header{
            display: flex;
        }
        .flexdiv1{
            background-color: lightblue;
            width: 200px;
        }
        .flexdiv2{
            background-color: lightpink;
            width: 75px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="flexdiv1">200px</div>
        <div class="flexdiv2">75px</div>
    </div>
</body>
</html>
