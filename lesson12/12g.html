<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12ghtml</title>
  <style>
    body{
      font-family: Arial;
      margin-top: 20px;
    }
    .subimg{
      width: 50px;
      height: 50px;
      object-fit: cover;
      object-position: center;
      border-radius: 50px;
    }
    .mainheader{
      display: flex;
      align-items: center;
      margin-top: 10px;
    }
    .follow{
      padding: 10px 20px;
      background-color: rgb(46, 157, 225);
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      font-size: 15px;
    }
    .txt1{
      font-weight: bold;
      font-size: 15px;
      margin-top: 2px;
      margin-bottom: 2px;
    }
    .txt2{
      font-size: 15px;
      margin-top: 2px;
      margin-bottom: 2px;
    }
    .txt3{
      font-size: 13px;
      margin-top: 2px;
      margin-bottom: 0;
    }
    .subheader1{
      margin-left: 5px;
      margin-right: 5px;
    }
    .subheader2{
     margin-left: 5px;
     width: 200px;
    margin-right: 5px; 
    }
  </style>
</head>
<body>
  <div class="mainheader">
    <div class="subheader1"><img src="/picture/cash-macanaya-ZozEOsMUF9I-unsplash.jpg" alt="" class="subimg"></div>
    <div class="subheader2">
      <div class="content">
        <p class="txt1">Oliver</p>
        <p class="txt2">the cat</p>
        <p class="txt3">Popular</p>
      </div>
    </div>
    <div class="subheader3">
      <button class="follow">follow</button>
    </div>
  </div>
  <div class="mainheader">

      <div class="content">
        <p class="txt1">Mimi</p>

      </div>
    </div>
    <div class="subheader3">
      <button class="follow">follow</button>
    </div>
  </div><div class="mainheader">

    <div class="subheader2">

</html>
