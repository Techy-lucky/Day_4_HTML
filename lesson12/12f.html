<!DOCTYPE html>
<html lang="en">
<head>

    }
    .download{
      margin: 10px;
      border: 1px solid white;

      background-color: rgb(187, 93, 238);
      padding-left: 10px;
      margin-left: 100px;
      margin-right: 10px;
    }

<body>
  <div class="header">

</html>
