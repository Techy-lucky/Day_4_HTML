<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .header{
            display: flex;
        }
        .flexdiv1{
            background-color: lightblue;
            width: 50px ;
        }
        .flexdiv2{
            background-color: lightpink;
            flex: 1;
        }
        .flexdiv3{
            background-color: lightblue;
            width: 75px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="flexdiv1">item1</div>
        <div class="flexdiv2">item2</div>
        <div class="flexdiv3">item3</div>
    </div>
</body>
</html>
