<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .mainflex{
            display: flex;
            flex-direction: row;
        }
        .div1{
            background-color: lightblue;
        }
        .div2{
            background-color: lightpink;
        }
        .mainflex1{
            display: flex;
            flex-direction: row;
            margin-top: 20px;
        }
        .divv1{
            background-color: lightblue;
            width: 100px;
        }
        .divv2{
            background-color: lightpink;
            flex: 1;
        }

        .mainflex2{
            display: flex;
            flex-direction: row;
            margin-top: 20px;
        }
        .div11{
            background-color: lightblue;
            width: 100px;
        }
        .div22{
            background-color: lightpink;
            flex: 1;
        }
        .div33{
            background-color: lightblue;
            flex: 2;
        }
    </style>
</head>
<body>
    <div class="mainflex">
        <div class="div1">div 1 text </div>
        <div class="div2">div 2 <p>tezt</p></div>
    </div>

    <div class="mainflex1">
        <div class="divv1">100px</div>
        <div class="divv2">flex1</div>
    </div>

    <div class="mainflex2">
        <div class="div22">flex1</div>
        <div class="div11">100px</div>
        <div class="div33">flex2</div>

    </div>
</body>
</html>
