<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid-a</title>
    <style>
        .main-grid{
            display: grid;
            grid-template-columns: 200px 75px;
        }
        .div1{
            background-color: lightblue;
        }
        .div2{
            background-color: lightpink;
        }
    </style>
</head>
<body>
    <div class="main-grid">
        <div class="div1">200px</div>
        <div class="div2">75px</div>
    </div>
</body>
</html>
