<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid-b</title>
    <style>
          .main-grid{
            display: grid;
            grid-template-columns: 50px 1fr 75px;
        }
        .div1{
            background-color: lightblue;
        }
        .div2{
            background-color: lightpink;
        }
    </style>
</head>
<body>
     <div class="main-grid">
        <div class="div1">col1</div>
        <div class="div2">col2</div>
        <div class="div1">col3</div>

    </div>
</body>
</html>
