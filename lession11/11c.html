<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid-b</title>
    <style>
          .main-grid{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            row-gap: 10px;
            column-gap: 20px;
        }
        .div2{
            background-color: lightpink;
        }
    </style>
</head>
<body>
     <div class="main-grid">
        <div class="div2">col1</div>
        <div class="div2">col2</div>
        <div class="div2">col3</div>
        <div class="div2">col4</div>
        <div class="div2">col5</div>
        <div class="div2">col6</div>
        <div class="div2">col7</div>
        <div class="div2">col8</div>
    </div>
</body>
</html>
