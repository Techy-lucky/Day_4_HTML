<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .divv{
            margin: 10px;
            border: 1px solid rgb(206, 204, 204);
            width: fit-content;
            box-shadow: 1px 1px 2px gray ;
            border-radius: 2px;
            font-family: arial;
        }
        .div-img{
            width: 200px;
            height: 200px;
            object-fit: cover;
            object-position: center;
        }
        .div-p1{
            margin-top: 5px;
            margin-bottom: 5px;
            margin-left: 10px;
            font-weight: bold;
        }
        .div-p2{
            margin-top: 0px;
            margin-bottom: 10px;
            color: gray;
            margin-left: 10px;

        }
        .div-btn{
            margin-top: 0px;
            margin-bottom: 10px;
            padding: 10px 20px;
            border: none;
            color: white;
            background-color: rgb(0, 170, 255);
            border-radius: 5px;
            font-weight: bold;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="divv">
        <img src="/picture/jonatan-pie-xgTMSz6kegE-unsplash.jpg" alt="img" class="div-img">
        <p class="div-p1">Oliver</p>
        <p class="div-p2">2 mutual friends</p>
        <button class="div-btn">Add Freind</button>
    </div>
</body>
</html>
