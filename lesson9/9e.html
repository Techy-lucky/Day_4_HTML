<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7gtext</title>
    <style>
        /* body{
            vertical-align: middle;
        } */
         .divv{
            box-shadow: 2px 2px 8px gray;
            margin: 10px;
            padding: 10px;
            width: 350px;
            border-radius: 5px;
            border: none;
         }
        .class1{
            height: 40px;
            width: 40px;
            vertical-align: middle;
            border-radius: 50px;
            object-fit: cover;
            object-position: center;
            margin: 3px;
        }
        .class2{
            padding: 10px 0px;
            margin: 3px;
            width: 200px;
            border: none;
            font-size: 15px;
            vertical-align: middle;
        }
        .class3{
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background-color: rgb(0, 123, 255);
            color: white;
            vertical-align: middle;
            font-weight: bold;
        }
    </style>
</head>
<body>
   <div class="divv">
    <img src="/picture/ingo-stiller-3tkxfe2GocY-unsplash.jpg" alt="" class="class1">
    <input type="text" name="" id="" class="class2" placeholder="What's happening?">
    <button class="class3">Tweet</button>
   </div>
</body>
</html>
