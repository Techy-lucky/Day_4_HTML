<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>youtube.com clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="youtube.css">
</head>

<body>
    <input type="text" class="class2" placeholder="Search">
    <div class="video-prev">
        <div class="tumbnail-prev">
            <img class="class1" src="/picture/gaf-clickz-pQ6PqHpuo-g-unsplash.jpg" alt="zoo picture">
        </div>
        <div class="inline">
            <div class="imgsrc">
                <img src="/picture/wexor-tmg-L-2p8fapOA8-unsplash.jpg" alt="logo" class="picture">
            </div>
            <div class="video-inf">
                <p class="class3">Talking tech and AI with Google CEO Sundar Pichai!</p>
                <p class="class4">Marques Browniee</p>
                <p class="class5">3.4M Views &#183; 6 months ago</p>
            </div>
        </div>
    </div>
     <div class="video-prev">
        <div class="tumbnail-prev">
            <img class="class1" src="/picture/dan-otis-OYFHT4X5isg-unsplash.jpg" alt="zoo picture">
        </div>
        <div class="inline">
            <div class="imgsrc">
                <img src="/picture/cash-macanaya-ZozEOsMUF9I-unsplash.jpg" alt="logo" class="picture">
            </div>
            <div class="video-inf">
                <p class="class3">Talking AI with Google CEO Sundar tech Pichai!</p>
                <p class="class4">Mar Brownee</p>
                <p class="class5">1.4M Views &#183; 2 months ago</p>
            </div>
        </div>
    </div>
</body>

</html>
