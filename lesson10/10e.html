<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cntdivv {
            margin: 10px;
            border: 1px solid rgb(206, 204, 204);
            width: fit-content;
            box-shadow: 1px 1px 2px gray;
            border-radius: 2px;
            font-family: arial;
            display: inline-block;
        }

        .div-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            object-position: center;
        }

        .div-p1 {
            margin-top: 5px;
            margin-bottom: 5px;
            margin-left: 10px;
            font-weight: bold;
        }

        .div-p2 {
            margin-top: 0px;
            margin-bottom: 10px;
            color: gray;
            margin-left: 2px;
        }

        .div-btn {
            margin-top: 10px;
            margin-bottom: 10px;
            padding: 10px 20px;
            border: none;
            color: white;
            background-color: rgb(0, 170, 255);
            border-radius: 5px;
            font-weight: bold;
            margin-left: 10px;
        }

        .frd-img {
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
        }

        .frd {
            display: inline-block;
            width: 150px;
        }

        .frdig {
            width: 30px;
            height: 30px;
            border-radius: 30px;
        }

        .comb {
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="maindiv">
        <div class="cntdivv">
            <div class="bigimg">
                <img src="/picture/jonatan-pie-xgTMSz6kegE-unsplash.jpg" alt="img" class="div-img">
            </div>
            <div class="img-name">
                <p class="div-p1">Oliver</p>
            </div>
            <div class="comb">
                <div class="frd-img">
                    <img src="/picture/boliviainteligente-37WxvlfW3to-unsplash.jpg" alt="" class="frdig">
                </div>
                <div class="frd">
                    <p class="div-p2">2 mutual friends</p>
                </div>
            </div>
            <div class="addfrd">
                <button class="div-btn">Add Freind</button>
            </div>
        </div>
          <div class="cntdivv">
            <div class="bigimg">
                <img src="/picture/cash-macanaya-ZozEOsMUF9I-unsplash.jpg" alt="img" class="div-img">
            </div>
            <div class="img-name">
                <p class="div-p1">Mimi</p>
            </div>
            <div class="comb">
                <div class="frd-img">
                    <img src="/picture/boliviainteligente-37WxvlfW3to-unsplash.jpg" alt="" class="frdig">
                </div>
                <div class="frd">
                    <p class="div-p2">3 mutual friends</p>
                </div>
            </div>
            <div class="addfrd">
                <button class="div-btn">Add Freind</button>
            </div>
        </div>
          <div class="cntdivv">
            <div class="bigimg">
                <img src="/picture/dan-otis-OYFHT4X5isg-unsplash.jpg" alt="img" class="div-img">
            </div>
            <div class="img-name">
                <p class="div-p1">Rex</p>
            </div>
            <div class="comb">
                <div class="frd-img">
                    <img src="/picture/boliviainteligente-37WxvlfW3to-unsplash.jpg" alt="" class="frdig">
                </div>
                <div class="frd">
                    <p class="div-p2">4 mutual friends</p>
                </div>
            </div>
            <div class="addfrd">
                <button class="div-btn">Add Freind</button>
            </div>
        </div>
    </div>
</body>

</html>
